name: Build and Release ThermalSight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows x64
            builder_cmd: npx electron-builder --win --x64 --publish never
          - os: macos-15-intel
            platform_name: macOS Intel (x64)
            builder_cmd: npx electron-builder --mac --x64 --publish never
          - os: macos-15
            platform_name: macOS Apple Silicon (arm64)
            builder_cmd: npx electron-builder --mac --arm64 --publish never
          - os: ubuntu-latest
            platform_name: Linux AppImage
            builder_cmd: npx electron-builder --linux --x64 --publish never

    name: Build on ${{ matrix.platform_name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── System dependencies (Linux) ──────────────────────────────────────────
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libglib2.0-0 libarchive-tools

      # ── Python backend ───────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy opencv-python matplotlib flyr

      - name: Install Python dependencies (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy opencv-python-headless matplotlib

      - name: Build analyzer executable
        run: >-
          pyinstaller
          --onedir
          --console
          --name analyzer
          --distpath backend/dist
          --hidden-import cv2
          --hidden-import matplotlib
          --hidden-import matplotlib.backends.backend_agg
          --hidden-import numpy
          backend/analyzer.py

      - name: Grant Executable Permissions (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod -R +x backend/dist/analyzer || true

      # ── Electron frontend ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: ./src
        run: npm install

      - name: Build Vite frontend
        working-directory: ./src
        run: npm run build

      - name: Optimize macOS Disk Image & Spotlight
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true

      - name: Package with Electron Builder
        working-directory: ./src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: ${{ matrix.builder_cmd }}

      # ── Publish Release Artifacts to GitHub ──────────────────────────────────
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src/release/*.exe
            src/release/*.dmg
            src/release/*.zip
            src/release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
