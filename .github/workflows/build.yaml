name: Build and Release ThermalSight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── System dependencies (Linux) ──────────────────────────────────────────
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libglib2.0-0 libarchive-tools

      # ── Python backend ───────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy opencv-python matplotlib flyr

      - name: Install Python dependencies (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy opencv-python-headless matplotlib

      - name: Build analyzer executable
        run: >-
          pyinstaller
          --onedir
          --console
          --name analyzer
          --distpath backend/dist
          --hidden-import cv2
          --hidden-import matplotlib
          --hidden-import matplotlib.backends.backend_agg
          --hidden-import numpy
          backend/analyzer.py

      # ── Electron frontend ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: ./src
        run: npm install

      - name: Build Vite frontend
        working-directory: ./src
        run: npm run build

      - name: Package with Electron Builder
        working-directory: ./src
        run: npx electron-builder --publish never

      # ── Publish Release Artifacts to GitHub ──────────────────────────────────
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src/release/*.exe
            src/release/*.dmg
            src/release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
